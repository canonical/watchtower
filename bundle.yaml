bundle: kubernetes
name: watchtower-k8s-bundle
description: |
  Full-stack Watchtower: Temporal Server + PostgreSQL + Watchtower bot.
  Temporal Admin initialises the default namespace after the server is
  up; without it workflows cannot be registered.

applications:

  postgresql-k8s:
    charm: postgresql-k8s
    channel: 14/stable
    scale: 1
    trust: true

  temporal-k8s:
    charm: temporal-k8s
    channel: 1.23/stable
    scale: 1
    trust: true
    options:
      services: frontend,history,matching,worker
      num-history-shards: 1

  temporal-admin-k8s:
    charm: temporal-admin-k8s
    channel: 1.23/stable
    scale: 1
    trust: true

  watchtower-k8s:
    charm: ./charm/watchtower-k8s_amd64.charm
    scale: 1
    resources:
      # Points to the MicroK8s local registry; update when a real
      # registry is available (see Open decisions in CHARM_PLAN.md).
      app-image: localhost:32000/watchtower:0.3

relations:
  - [temporal-k8s:db, postgresql-k8s:database]
  - [temporal-k8s:visibility, postgresql-k8s:database]
  - [temporal-admin-k8s:admin, temporal-k8s:admin]
  - [watchtower-k8s:temporal-host-info, temporal-k8s:temporal-host-info]

# ── Post-deploy: create the Temporal default namespace ──────────────────────
#
# temporal-admin-k8s is supposed to create the default namespace automatically,
# but a bug in its pebble layer causes the healthcheck (pgrep temporal-server)
# to fail permanently: the temporal-server process runs in the temporal-k8s pod,
# not in temporal-admin-k8s. This keeps the init service inactive indefinitely.
#
# After `juju deploy ./bundle.yaml` completes and all units are active/idle,
# run this once to create the namespace via the charm's built-in cli action:
#
#   juju run temporal-admin-k8s/0 cli \
#       args="operator namespace create default"
#
# This is idempotent — safe to re-run; Temporal will reject duplicates cleanly.
# The `make deploy` target automates bundle deploy + this step end-to-end.
