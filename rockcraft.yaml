name: watchtower
base: bare
build-base: ubuntu@24.04
version: '0.5'
summary: Ubuntu image build pipeline monitor
description: |
  Watchtower monitors Ubuntu image build pipelines via proactive
  Temporal cron workflows and a reactive Mattermost bot.
platforms:
  amd64:
  arm64:

extensions:
  - go-framework

parts:
  go-framework/install-app:
    # The main package lives in cmd/bot, so the compiled binary is
    # named "bot". Map it to the name the extension expects.
    organize:
      bin/bot: usr/local/bin/watchtower

  disable-go-service:
    # The go-framework extension bakes in a pebble service named "go"
    # that runs without env vars. The charm manages its own "watchtower"
    # service, so disable the stale one at the rock level.
    plugin: dump
    source: .
    override-build: |
      mkdir -p "${CRAFT_PART_INSTALL}/var/lib/pebble/default/layers"
      cat > "${CRAFT_PART_INSTALL}/var/lib/pebble/default/layers/002-disable-go.yaml" <<'EOF'
      services:
        go:
          override: merge
          startup: disabled
      EOF
    stage:
      - var/lib/pebble/default/layers/002-disable-go.yaml
