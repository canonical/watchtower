name: watchtower
base: bare
build-base: ubuntu@24.04
version: '0.6'
summary: Ubuntu image build pipeline monitor
description: |
  Watchtower monitors Ubuntu image build pipelines via proactive
  Temporal cron workflows and a reactive Mattermost bot.
platforms:
  amd64:
  arm64:

extensions:
  - go-framework

# The go-framework extension bakes in a pebble service named "go".
# The charm manages its own "watchtower" service, so disable the
# extension's service at the rock level via the idiomatic services: key.
services:
  go:
    override: merge
    startup: disabled

parts:
  go-framework/install-app:
    # The main package lives in cmd/bot, so the compiled binary is
    # named "bot". Map it to the name the extension expects.
    organize:
      bin/bot: usr/local/bin/watchtower
